name: Go Tests

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux uwgwrapper preload asset (glibc)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            golang:1.24-bullseye \
            bash -lc 'export PATH=/usr/local/go/bin:$PATH GOTOOLCHAIN=auto && \
              apt-get update >/dev/null && apt-get install -y gcc libc6-dev >/dev/null && \
              bash ./preload/build_phase1.sh cmd/uwgwrapper/assets/uwgpreload.so'
          sudo chown -R "$(id -u):$(id -g)" cmd/uwgwrapper/assets

      - name: Build Linux uwgwrapper ptloader asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ./preload/build_ptloader.sh cmd/uwgwrapper/assets

      - name: Build Linux uwgwrapper static-injection blob
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # cmd/uwgwrapper/embed_static_${arch}.go //go:embed's this file —
          # `go build` errors with "pattern …: no matching files found"
          # without it. Required before any `go test ./tests/preload` /
          # `go build ./cmd/uwgwrapper` invocation in this workflow.
          bash ./preload/build_static.sh >/dev/null
          ls -la cmd/uwgwrapper/assets/uwgpreload-static-*.so

      - name: Run tests
        if: runner.os != 'Linux'
        shell: bash
        run: go test ./... || go test ./...

      - name: Run tests (Linux core)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list ./... | grep -v '/tests/preload$')
          go test "${packages[@]}"

      - name: Run tests (Linux preload retry)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test ./tests/preload/... || go test ./tests/preload/...

      # ── Chrome installation ─────────────────────────────────────────────────
      # linux-amd64: chrome-headless-shell from Chrome for Testing (linux64).
      # linux-arm64: google-chrome-stable arm64 deb (Google's official arm64
      #   build; available since Chrome 119). Falls back gracefully if the
      #   download fails (continue-on-error).
      # macOS: chrome-headless-shell from Chrome for Testing (mac-arm64 or
      #   mac-x64 auto-detected from uname -m). Quarantine attr removed so
      #   Gatekeeper doesn't block execution.
      # Windows: chrome-headless-shell from Chrome for Testing (win64).
      # ─────────────────────────────────────────────────────────────────────
      - name: Install chrome (linux-amd64)
        if: runner.os == 'Linux' && matrix.name == 'linux-amd64'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chs"
          URL=$(curl -sSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print([x["url"] for x in d["channels"]["Stable"]["downloads"]["chrome-headless-shell"] if x["platform"]=="linux64"][0])')
          curl -sSL "$URL" -o "$RUNNER_TEMP/chs/chs.zip"
          unzip -q "$RUNNER_TEMP/chs/chs.zip" -d "$RUNNER_TEMP/chs"
          BIN=$(find "$RUNNER_TEMP/chs" -name chrome-headless-shell -executable | head -1)
          echo "UWGS_CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "UWGS_CHROME_BIN_SUPERVISED=$BIN" >> "$GITHUB_ENV"
          echo "installed chrome-headless-shell at $BIN"

      - name: Install chrome (linux-arm64)
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        # Google Chrome stable for arm64 is available since Chrome 119.
        # Falls back gracefully: if the download or install fails the
        # proxy smoke step self-skips (UWGS_CHROME_BIN stays unset).
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb \
            -o /tmp/chrome-arm64.deb
          sudo apt-get install -y /tmp/chrome-arm64.deb
          BIN=$(which google-chrome-stable || which google-chrome || true)
          if [ -n "$BIN" ]; then
            echo "UWGS_CHROME_BIN=$BIN" >> "$GITHUB_ENV"
            echo "installed google-chrome-stable at $BIN"
          fi

      - name: Install chrome (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            CHS_PLATFORM="mac-arm64"
          else
            CHS_PLATFORM="mac-x64"
          fi
          mkdir -p "$RUNNER_TEMP/chs"
          URL=$(curl -sSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([x['url'] for x in d['channels']['Stable']['downloads']['chrome-headless-shell'] if x['platform']=='$CHS_PLATFORM'][0])")
          curl -sSL "$URL" -o "$RUNNER_TEMP/chs/chs.zip"
          unzip -q "$RUNNER_TEMP/chs/chs.zip" -d "$RUNNER_TEMP/chs"
          BIN=$(find "$RUNNER_TEMP/chs" -name chrome-headless-shell | head -1)
          chmod +x "$BIN"
          # Remove macOS quarantine so Gatekeeper doesn't block execution.
          xattr -dr com.apple.quarantine "$BIN" 2>/dev/null || true
          echo "UWGS_CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "installed chrome-headless-shell ($CHS_PLATFORM) at $BIN"

      - name: Install chrome (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\chs"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $json = Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          $url = ($json.channels.Stable.downloads.'chrome-headless-shell' | Where-Object { $_.platform -eq 'win64' }).url
          Invoke-WebRequest -Uri $url -OutFile "$dir\chs.zip"
          Expand-Archive -Path "$dir\chs.zip" -DestinationPath $dir -Force
          $bin = (Get-ChildItem -Recurse -Filter 'chrome-headless-shell.exe' $dir | Select-Object -First 1).FullName
          echo "UWGS_CHROME_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installed chrome-headless-shell at $bin"

      # ── Chromium smoke tests ────────────────────────────────────────────────
      # Preload wrapper smoke (linux-amd64): Chrome under
      # uwgwrapper --transport=preload. The proxy connect goes over
      # loopback (bypassed by the preload shim) — zero wrapper latency,
      # reliably passes on GH-hosted runners. No continue-on-error.
      - name: Run chromium preload wrapper smoke (linux-amd64)
        if: runner.os == 'Linux' && matrix.name == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome binary detected; skipping preload wrapper smoke"
            exit 0
          fi
          go test -count=1 -timeout 120s -run TestChromiumPreloadWrapperSmoke -v ./tests/preload/

      # ARM64 parity: same preload wrapper smoke against google-chrome-stable
      # arm64. continue-on-error until we've seen a few consecutive greens —
      # arm64 chrome behaviour on GH-hosted runners differs from
      # chrome-headless-shell on amd64.
      - name: Run chromium preload wrapper smoke (linux-arm64)
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome binary detected; skipping preload wrapper smoke"
            exit 0
          fi
          go test -count=1 -timeout 120s -run TestChromiumPreloadWrapperSmoke -v ./tests/preload/

      # Proxy smoke (all platforms): Chrome WITHOUT a wrapper, directly
      # against the uwgsocks HTTP proxy. Runs wherever UWGS_CHROME_BIN
      # is set. No continue-on-error on linux-amd64 and macOS where the
      # binary is chrome-headless-shell from Chrome for Testing (reliable).
      # linux-arm64 uses google-chrome-stable which may have env-specific
      # quirks; arm64 step has continue-on-error.
      - name: Run chromium proxy smoke (linux-amd64, macOS, Windows)
        if: (runner.os == 'Linux' && matrix.name == 'linux-amd64') || runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome binary detected; skipping proxy smoke"
            exit 0
          fi
          go test -count=1 -timeout 90s -run TestChromiumProxySmoke -v ./tests/preload/

      - name: Run chromium proxy smoke (linux-arm64)
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        # google-chrome-stable on arm64 may behave differently in GH
        # runner environments; keep continue-on-error until validated.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome binary detected; skipping proxy smoke"
            exit 0
          fi
          go test -count=1 -timeout 90s -run TestChromiumProxySmoke -v ./tests/preload/

      - name: Run chromium real-internet smoke (linux-amd64)
        if: runner.os == 'Linux' && matrix.name == 'linux-amd64'
        # GH-runner network quirks can produce flakes; continue-on-error so
        # CI signal stays useful. Self-hosted runs surface real regressions.
        continue-on-error: true
        env:
          UWGS_RUN_CHROMIUM_REAL_INTERNET: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome-headless-shell detected; skipping smoke"
            exit 0
          fi
          go test -count=1 -timeout 240s -run TestChromiumRealInternetSmoke -v ./tests/preload/

      # ARM64 parity for the real-internet smoke. Same continue-on-error
      # rationale as amd64; we want to see whether the underlying wrapper
      # paths work against real-network targets on arm64 too.
      - name: Run chromium real-internet smoke (linux-arm64)
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        continue-on-error: true
        env:
          UWGS_RUN_CHROMIUM_REAL_INTERNET: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN:-}" ]; then
            echo "no chrome binary detected; skipping smoke"
            exit 0
          fi
          go test -count=1 -timeout 240s -run TestChromiumRealInternetSmoke -v ./tests/preload/

      # The "Final Boss" smoke: chromium under systrap-supervised
      # against real-internet (example.com → wikipedia → youtube)
      # with the zygote ACTIVE and no UWGS_DISABLE_SECCOMP.
      - name: Run chromium-supervised real-internet smoke (linux-amd64)
        if: runner.os == 'Linux' && matrix.name == 'linux-amd64'
        # Chrome-for-testing download flakes + GH-runner network
        # to youtube can be intermittent; continue-on-error so
        # CI signal stays clean. Self-hosted + dev runs surface
        # real regressions in this path.
        continue-on-error: true
        env:
          UWGS_RUN_CHROMIUM_SUPERVISED: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN_SUPERVISED:-}" ]; then
            echo "chrome-headless-shell not installed; skipping supervised smoke"
            exit 0
          fi
          go test -count=1 -timeout 360s -run TestChromiumSystrapSupervisedRealInternet -v ./tests/preload/

      # ARM64 parity for the supervised real-internet smoke. Uses
      # google-chrome-stable arm64 — the binary chrome-for-testing
      # doesn't publish reliably yet. continue-on-error: this is the
      # hardest wrapper path even on amd64; arm64 surfaces are
      # genuinely valuable data.
      - name: Run chromium-supervised real-internet smoke (linux-arm64)
        if: runner.os == 'Linux' && matrix.name == 'linux-arm64'
        continue-on-error: true
        env:
          UWGS_RUN_CHROMIUM_SUPERVISED: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UWGS_CHROME_BIN_SUPERVISED:-}" ]; then
            # On arm64 we don't auto-install chrome-headless-shell —
            # fall back to UWGS_CHROME_BIN (google-chrome-stable) if set.
            if [ -n "${UWGS_CHROME_BIN:-}" ]; then
              export UWGS_CHROME_BIN_SUPERVISED="${UWGS_CHROME_BIN}"
            else
              echo "no chrome binary; skipping arm64 supervised smoke"
              exit 0
            fi
          fi
          go test -count=1 -timeout 360s -run TestChromiumSystrapSupervisedRealInternet -v ./tests/preload/

      - name: Run standalone TURN tests
        shell: bash
        run: |
          set -euo pipefail
          cd turn
          go test ./...

      - name: Real Linux host-TUN smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e UWG_TEST_REAL_TUN=1 \
            -v "$PWD":/src -w /src golang:1.25 \
            bash -lc 'export PATH=/usr/local/go/bin:$PATH GOFLAGS=-buildvcs=false && apt-get update >/dev/null && apt-get install -y gcc libc6-dev >/dev/null && /bin/bash ./compile.sh >/dev/null && go test ./internal/tun -run TestRealLinuxTUNConfigureSmallRoute -count=1 && go test ./internal/engine -run TestRealLinuxTUNEngineE2E -count=1 -timeout 60s'

      - name: Real macOS host-TUN smoke test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo env UWG_TEST_REAL_TUN=1 go test ./internal/tun -run TestRealUTUNConfigureSmallRoute -count=1

      - name: Install Wintun
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wintun'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip -TimeoutSec 60
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir 'wintun\bin\amd64\wintun.dll') 'C:\Windows\System32\wintun.dll' -Force

      - name: Real Windows host-TUN smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:UWG_TEST_REAL_TUN = '1'
          go test ./internal/tun -run TestRealWindowsTUNConfigureSmallRoute -count=1 -timeout 90s

  test-lite:
    name: lite ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux uwgwrapper preload asset (glibc)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            golang:1.24-bullseye \
            bash -lc 'export PATH=/usr/local/go/bin:$PATH GOTOOLCHAIN=auto && \
              apt-get update >/dev/null && apt-get install -y gcc libc6-dev >/dev/null && \
              bash ./preload/build_phase1.sh cmd/uwgwrapper/assets/uwgpreload.so'
          sudo chown -R "$(id -u):$(id -g)" cmd/uwgwrapper/assets

      - name: Build Linux uwgwrapper ptloader asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ./preload/build_ptloader.sh cmd/uwgwrapper/assets

      - name: Build Linux uwgwrapper static-injection blob
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ./preload/build_static.sh >/dev/null
          ls -la cmd/uwgwrapper/assets/uwgpreload-static-*.so

      - name: Run lite tests
        shell: bash
        run: |
          # Retry once on flaky ptrace-only mode tests (same pattern as
          # the main test step); the underlying tests are correct, but
          # GH-runner CPU contention occasionally trips the timeouts.
          go test -tags lite ./... || go test -tags lite ./...

  # Slim musl matrix on every push: catches musl-only build/runtime
  # divergences (e.g., struct timespec without <time.h>, sendmmsg flags
  # arg type) before they compound. The full glibc 2.27/2.31/2.36 +
  # musl current/older × amd64+arm64 matrix lives in release.yml's
  # preload-libc-matrix and runs on tag pushes only.
  preload-musl:
    name: preload musl ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Run a representative preload subset under golang:alpine (musl)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            golang:1.24-alpine \
            sh -c '
              apk add --no-cache gcc musl-dev linux-headers git bash file >/dev/null
              export PATH=/usr/local/go/bin:$PATH GOTOOLCHAIN=auto
              git init -q . 2>/dev/null || true
              bash ./preload/build_ptloader.sh cmd/uwgwrapper/assets
              bash ./preload/build_static.sh >/dev/null
              # Slim test set: lock primitives + Phase 2 Go-static (the
              # paths we know work under musl). The arm64+musl+static-PIE
              # +C corner case is documented as a known limitation in
              # preload/PHASE2_DESIGN.md and excluded from this CI subset.
              go test -buildvcs=false -count=1 -timeout 480s \
                -run "TestPhase1Fxlock|TestPhase1CacheRace|TestPhase2StaticGo" \
                ./tests/preload/
            '

  cross-build:
    name: cross-build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-build uwgsocks
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath ./cmd/uwgsocks
          go build -tags lite -trimpath ./cmd/uwgsocks
          cd turn && go build -trimpath .
